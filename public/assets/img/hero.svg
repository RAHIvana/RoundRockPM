<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-label="Illustration of Hill Country homes at golden hour" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7ece0"/><stop offset="55%" stop-color="#f4e3d3"/><stop offset="100%" stop-color="#edd6c3"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d6b58"/><stop offset="100%" stop-color="#2d5544"/>
    </linearGradient>
    <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27503f"/><stop offset="100%" stop-color="#1f4437"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4623c"/><stop offset="100%" stop-color="#a94f2d"/>
    </linearGradient>
    <clipPath id="frame"><rect width="720" height="560" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="720" height="560" fill="url(#sky)"/>
    <circle cx="545" cy="140" r="62" fill="#f3c9a3" opacity=".55"/>
    <circle cx="545" cy="140" r="38" fill="#e8ad7e" opacity=".65"/>

    <!-- distant ridge -->
    <path d="M0 292c70-30 120-8 176-30s96-44 168-24 108 56 174 40 132-38 202-14v58H0z" fill="#8fae9e" opacity=".45"/>
    <path d="M0 330c88-26 128 6 196-16s120-38 186-16 116 48 178 34 98-26 160-10v48H0z" fill="url(#hillA)" opacity=".85"/>

    <!-- mid ground band -->
    <rect y="372" width="720" height="188" fill="url(#hillB)"/>
    <path d="M0 372c96-22 150 16 246 8s148-34 236-18 152 30 238 10v22H0z" fill="#2d5544"/>

    <!-- main house -->
    <g transform="translate(232 158)">
      <rect x="18" y="96" width="228" height="150" rx="8" fill="#fcfaf6"/>
      <path d="M0 104 132 8l132 96z" fill="url(#roof)"/>
      <rect x="120" y="0" width="24" height="42" rx="4" fill="#a94f2d"/>
      <rect x="52" y="132" width="46" height="46" rx="6" fill="#f4efe7" stroke="#d7cabb" stroke-width="3"/>
      <rect x="166" y="132" width="46" height="46" rx="6" fill="#f4efe7" stroke="#d7cabb" stroke-width="3"/>
      <path d="M75 132v46M52 155h46M189 132v46M166 155h46" stroke="#d7cabb" stroke-width="3"/>
      <rect x="107" y="180" width="50" height="66" rx="5" fill="#1f4437"/>
      <circle cx="146" cy="215" r="4" fill="#e5a582"/>
      <rect x="18" y="96" width="228" height="10" fill="#e9e0d3"/>
    </g>

    <!-- left house -->
    <g transform="translate(58 246)" opacity=".96">
      <rect x="10" y="58" width="132" height="98" rx="6" fill="#f4efe7"/>
      <path d="M0 62 76 12l76 50z" fill="#2d5544"/>
      <rect x="34" y="86" width="34" height="34" rx="4" fill="#fcfaf6" stroke="#d7cabb" stroke-width="2.5"/>
      <rect x="90" y="86" width="34" height="34" rx="4" fill="#fcfaf6" stroke="#d7cabb" stroke-width="2.5"/>
      <rect x="66" y="124" width="30" height="32" rx="4" fill="#1f4437"/>
    </g>

    <!-- right house -->
    <g transform="translate(512 236)" opacity=".96">
      <rect x="12" y="66" width="150" height="110" rx="6" fill="#f4efe7"/>
      <path d="M0 70 87 16l87 54z" fill="#c4623c"/>
      <rect x="40" y="96" width="38" height="38" rx="4" fill="#fcfaf6" stroke="#d7cabb" stroke-width="2.5"/>
      <rect x="100" y="96" width="38" height="38" rx="4" fill="#fcfaf6" stroke="#d7cabb" stroke-width="2.5"/>
      <rect x="72" y="140" width="32" height="36" rx="4" fill="#1f4437"/>
    </g>

    <!-- trees -->
    <g fill="#1f4437">
      <path d="M186 400c0-26 14-46 24-46s24 20 24 46z" opacity=".9"/>
      <rect x="206" y="396" width="8" height="28" rx="3"/>
      <path d="M470 414c0-22 12-40 21-40s21 18 21 40z" opacity=".9"/>
      <rect x="487" y="410" width="8" height="26" rx="3"/>
      <path d="M640 396c0-28 15-50 26-50s26 22 26 50z" opacity=".85"/>
      <rect x="662" y="392" width="8" height="30" rx="3"/>
    </g>

    <!-- path -->
    <path d="M338 404c-18 40-70 62-118 90 92 6 232 6 324 0-58-26-118-48-138-90z" fill="#3d6b58" opacity=".55"/>

    <!-- fence -->
    <g stroke="#e9e0d3" stroke-width="5" stroke-linecap="round" opacity=".55">
      <path d="M40 470v44M78 470v44M116 470v44M604 470v44M642 470v44M680 470v44"/>
      <path d="M22 486h112M586 486h112"/>
    </g>
  </g>
</svg>
