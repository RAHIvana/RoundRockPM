# /etc/nginx/sites-available/roundrockpm
# Static site for roundrockpm.com on a GCP e2-micro.
# Certbot rewrites the TLS bits when you run it (see deploy/vm-setup.sh).

server {
    listen 80;
    listen [::]:80;
    server_name roundrockpm.com www.roundrockpm.com;

    root /var/www/roundrockpm;
    index index.html;

    # --- security headers ---------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # --- compression (big win on a shared-core VM) --------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json image/svg+xml application/xml;

    # --- caching ------------------------------------------------------------
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    location = /assets/data/properties.json {
        add_header Cache-Control "no-cache";   # listings should update instantly
        try_files $uri =404;
    }

    location = /assets/js/config.js {
        add_header Cache-Control "no-cache";   # so config changes take effect at once
        try_files $uri =404;
    }

    # --- pretty URLs: /services -> /services.html ---------------------------
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Nothing sensitive is served from here.
    location ~ /\. { deny all; }
}
